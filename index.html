<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лекции по ЧМ</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Численные методы</h2>
                <button id="closeSidebarBtn" class="close-btn">✕</button>
            </div>

            <div class="select-group">
                <label>Выберите тему:</label>
                <select id="topicSelect">
                    <option value="" disabled selected>-- Тема --</option>
                </select>
            </div>

            <div id="questionsContainer" class="questions-list"></div>
        </aside>

        <main class="viewer">
            <div class="viewer-header">
                <button id="openSidebarBtn" class="menu-btn">☰ Меню</button>
            </div>
            
            <div id="placeholder" class="placeholder">
                <p>Выберите вопрос, чтобы открыть лекцию</p>
            </div>
            
            <div id="pdfContainer" style="display: none;">
                <canvas id="pdfCanvas"></canvas>
                <div id="pageNav">
                    <button id="prevPage">◀ Назад</button>
                    <span id="pageNumInfo">Страница 1</span>
                    <button id="nextPage">Вперед ▶</button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
