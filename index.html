<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лекции по ЧМ</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2>Численные методы</h2>

            <div class="select-group">
                <label>Выберите тему:</label>
                <select id="topicSelect">
                    <option value="" disabled selected>-- Тема --</option>
                </select>
            </div>

            <div id="questionsContainer" class="questions-list">
                </div>
        </aside>

        <main class="viewer">
            <div id="placeholder" class="placeholder">
                <p>Выберите вопрос, чтобы открыть лекцию</p>
            </div>
            <div id="pdfContainer" style="display: none; overflow: auto; height: 100%;">
                <canvas id="pdfCanvas" style="width: 100%; height: auto;"></canvas>
                <div id="pageNav" style="padding: 10px; text-align: center; background: #1e293b;">
                    <button id="prevPage" style="margin-right: 10px;">◀ Назад</button>
                    <span id="pageNumInfo">Страница 1</span>
                    <button id="nextPage" style="margin-left: 10px;">Вперед ▶</button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
